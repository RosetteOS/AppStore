# RosetteOS Cloudflare Tunnel (cloudflared) Integration
# Zero-port-forwarding HTTPS remote access to Mainsail / Fluidd
# Project: https://github.com/cloudflare/cloudflared

[gcode_macro CLOUDFLARED_STATUS]
description: Show Cloudflare Tunnel status and active public HTTPS URL
gcode:
    RUN_SHELL_COMMAND CMD=cloudflared_ctl PARAMS="status"

[gcode_macro CLOUDFLARED_QUICK_TUNNEL]
description: Start a free temporary Quick Tunnel (*.trycloudflare.com) to Mainsail/Fluidd
gcode:
    {% set port = params.PORT|default("80")|string %}
    {action_respond_info("Switching Cloudflare Tunnel to Quick Tunnel mode (http://127.0.0.1:" ~ port ~ ")...")}
    RUN_SHELL_COMMAND CMD=cloudflared_ctl PARAMS="quick {port}"

[gcode_macro CLOUDFLARED_SET_TOKEN]
description: Configure a persistent Cloudflare Zero Trust tunnel token (CLOUDFLARED_SET_TOKEN TOKEN=eyJh...)
gcode:
    {% set token = params.TOKEN|default("")|string %}
    {% if token == "" %}
        {action_respond_info("Usage: CLOUDFLARED_SET_TOKEN TOKEN=<your-cloudflare-tunnel-token>")}
    {% else %}
        {action_respond_info("Saving Cloudflare Zero Trust tunnel token and restarting tunnel...")}
        RUN_SHELL_COMMAND CMD=cloudflared_ctl PARAMS="set-token {token}"
    {% endif %}

[gcode_macro CLOUDFLARED_RESTART]
description: Restart the Cloudflare Tunnel service
gcode:
    RUN_SHELL_COMMAND CMD=cloudflared_ctl PARAMS="restart"

[gcode_shell_command cloudflared_ctl]
command: /usr/data/rosetteos/apps/cloudflared/cloudflared-ctl.sh
timeout: 30.0
verbose: True
