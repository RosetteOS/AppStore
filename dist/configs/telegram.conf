# Moonraker-Telegram-Bot Configuration for RosetteOS
# Documentation: https://github.com/nlef/moonraker-telegram-bot/wiki
#
# Quick Setup:
#   1. Message @BotFather on Telegram (/newbot) to get your bot_token.
#   2. Paste your bot_token below and save this file.
#   3. Send any message to your bot on Telegram — if chat_id is still 0,
#      the bot will reply with your chat_id (or check telegram.log).
#   4. Paste your chat_id below and save. The bot will connect automatically!

[bot]
server: 127.0.0.1:7125
bot_token: your_bot_token_here
chat_id: 0

[camera]
host: http://127.0.0.1:8080/?action=stream
host_snapshot: http://127.0.0.1:8080/?action=snapshot
type: mjpeg

[progress_notification]
percent: 10
height: 0
time: 0

