# RosetteOS Klipper-Backup Macro Integration
# Automated GitHub sync for Klipper and printer configuration
# Repository: https://github.com/Staubgeborener/klipper-backup

[gcode_macro BACKUP_CFG]
description: Backs up printer configuration to GitHub using Klipper-Backup
gcode:
    {% set msg = params.MESSAGE|default("")|string %}
    {% if msg != "" %}
        RUN_SHELL_COMMAND CMD=klipper_backup_script PARAMS="-c \"{msg}\""
    {% else %}
        RUN_SHELL_COMMAND CMD=klipper_backup_script
    {% endif %}

[gcode_shell_command klipper_backup_script]
command: /usr/data/rosetteos/apps/klipper-backup/script.sh
timeout: 120.0
verbose: True
