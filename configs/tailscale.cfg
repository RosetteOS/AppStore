# RosetteOS Tailscale VPN Integration
# Secure zero-config remote access from any device on your Tailnet
# Project: https://tailscale.com

[gcode_macro TAILSCALE_STATUS]
description: Check Tailscale VPN status and connection details
gcode:
    RUN_SHELL_COMMAND CMD=tailscale_cmd PARAMS="status"

[gcode_macro TAILSCALE_IP]
description: Show assigned Tailscale IP address (IPv4)
gcode:
    RUN_SHELL_COMMAND CMD=tailscale_cmd PARAMS="ip -4"

[gcode_macro TAILSCALE_UP]
description: Connect printer to Tailscale (e.g. TAILSCALE_UP AUTHKEY=tskey-auth-xxx [HOSTNAME=my-printer])
gcode:
    {% set authkey = params.AUTHKEY|default("")|string %}
    {% set hostname = params.HOSTNAME|default("rosetteos")|string %}
    {% if authkey != "" %}
        {action_respond_info("Connecting to Tailscale with authkey...")}
        RUN_SHELL_COMMAND CMD=tailscale_cmd PARAMS="up --authkey={authkey} --hostname={hostname} --reset"
    {% else %}
        {action_respond_info("Starting Tailscale interactive login...")}
        RUN_SHELL_COMMAND CMD=tailscale_cmd PARAMS="up --hostname={hostname}"
    {% endif %}

[gcode_macro TAILSCALE_DOWN]
description: Disconnect printer from Tailscale network
gcode:
    RUN_SHELL_COMMAND CMD=tailscale_cmd PARAMS="down"

[gcode_shell_command tailscale_cmd]
command: /usr/data/rosetteos/apps/tailscale/tailscale
timeout: 120.0
verbose: True
